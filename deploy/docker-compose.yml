# Запуск (из папки deploy/):
#   Tailscale (нет домена):  docker compose up -d --build
#                            затем: sudo tailscale serve --bg 8000   (или funnel — см. DEPLOY.md)
#   Свой домен + Caddy:      docker compose --profile caddy up -d --build
# Нужны: ../.env (настройки) и ../secrets/sa.json (ключ сервисного аккаунта).
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      TCM_SA_KEY_FILE: /secrets/sa.json
      TCM_STATE_DIR: /state
      # порт открыт только на 127.0.0.1 хоста: достучаться могут лишь tailscaled/caddy на этой машине
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ../secrets/sa.json:/secrets/sa.json:ro
      - state:/state   # комментарии
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    env_file: ../.env  # берёт TCM_DOMAIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  state:
  caddy_data:
  caddy_config:
