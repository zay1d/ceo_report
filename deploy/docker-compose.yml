# Запуск: cd deploy && docker compose up -d --build
# Нужны: ../.env (настройки) и ../secrets/sa.json (ключ сервисного аккаунта).
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      TCM_SA_KEY_FILE: /secrets/sa.json
      # порт приложения наружу не открыт, достучаться может только caddy из этой сети
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ../secrets/sa.json:/secrets/sa.json:ro
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    env_file: ../.env  # берёт TCM_DOMAIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
